[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/m0x6A/saidwork"

[workspace.dependencies]
# internal
saidwork-kernel = { path = "crates/kernel" }
saidwork-formats = { path = "crates/formats" }
saidwork-providers = { path = "crates/providers" }
saidwork-transcription = { path = "crates/transcription" }
saidwork-rewriting = { path = "crates/rewriting" }
saidwork-capture = { path = "crates/capture" }
saidwork-notes = { path = "crates/notes" }
saidwork-app = { path = "crates/app" }
saidwork-tui = { path = "crates/tui" }

# async + http
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-std", "io-util", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "charset", "http2"] }
async-trait = "0.1"
futures = "0.3"

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
serde_yaml_ng = "0.10"

# domain helpers
url = { version = "2.5", features = ["serde"] }
secrecy = { version = "0.10", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1.28", features = ["v4", "serde"] }
directories = "6.0"
hound = "3.5"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# ui
clap = { version = "4.6", features = ["derive", "env"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = { version = "0.29", features = ["event-stream"] }

# platform
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"
cpal = "0.18"
nix = { version = "0.31", features = ["signal", "process"] }

# dev
wiremock = "0.6"
tempfile = "3.27"
insta = { version = "1.49", features = ["yaml"] }
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
