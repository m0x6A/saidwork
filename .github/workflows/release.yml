name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpulse headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p saidwork
      - name: Package
        run: |
          name=saidwork-${GITHUB_REF_NAME}-x86_64-linux
          mkdir -p "$name"
          cp target/release/saidwork README.md LICENSE-MIT LICENSE-APACHE "$name"/
          cp -r config formats "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" saidwork-*.tar.gz* --generate-notes --verify-tag
